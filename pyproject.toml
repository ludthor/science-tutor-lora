[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "science-tutor-lora"
version = "0.1.0.dev0"
description = "Reproducible LoRA experiments for educational science question answering."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Ariel Ortiz Beltrán" }]
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
science-tutor = "science_tutor.cli:main"

[project.urls]
Repository = "https://github.com/ludthor/science-tutor-lora"

[dependency-groups]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/science_tutor"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
